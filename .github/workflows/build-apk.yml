name: Build HTML to Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Web App to APK
        uses: kimhuilim/web-to-app-action@v1.0.0
        with:
          build-folder-path: './'
          app-name: 'WikiCards'
          output-folder-path: 'apk/'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WikiCards-APK
          path: apk/*.apk
