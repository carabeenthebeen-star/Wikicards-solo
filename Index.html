<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiCards Solo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0B0F19; color: #F8FAFC; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
        .resources { background: #1E293B; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        .nav { display: flex; width: 100%; max-width: 400px; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #1E293B; color: #FFF; font-weight: bold; cursor: pointer; }
        .nav-btn.active { background: #4F46E5; }

        .container { width: 100%; max-width: 400px; flex: 1; display: flex; flex-direction: column; align-items: center; }

        /* Boutique */
        .pack-card { background: #1E293B; border-radius: 12px; border: 2px solid; width: 100%; margin-bottom: 15px; overflow: hidden; text-align: center; }
        .pack-header { padding: 10px; font-weight: bold; font-size: 16px; }
        .pack-desc { padding: 12px; color: #94A3B8; font-size: 13px; }
        .buy-btn { width: calc(100% - 24px); margin: 0 12px 12px 12px; padding: 10px; border: none; border-radius: 8px; color: #FFF; font-weight: bold; cursor: pointer; }
        
        .free-btn { background: #10B981; color: #FFF; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }

        /* Carte de Jeu */
        .card { background: #1E293B; border-radius: 16px; border: 3px solid #F59E0B; width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; margin-bottom: 20px; min-height: 360px; justify-content: center; }
        .rarity-badge { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: bold; color: #000; }
        .duplicate-badge { position: absolute; top: 12px; right: 12px; background: #EF4444; padding: 4px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
        .card-img { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .card-extract { font-size: 12px; color: #94A3B8; line-height: 1.4; }

        .primary-btn { background: #4F46E5; color: #FFF; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; font-size: 15px; }

        /* Codex / Collection */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .codex-card { background: #1E293B; border-radius: 10px; border: 2px solid; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .codex-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-bottom: 6px; }
        .codex-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .codex-rarity { font-size: 9px; font-weight: bold; }
        
        .hidden { display: none !important; }
        .loading { text-align: center; color: #94A3B8; margin-top: 50px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>WikiCards</h1>
        <div class="resources">🪙 <span id="points-display">200</span> | ✨ <span id="dust-display">0</span></div>
    </header>

    <div class="nav">
        <button class="nav-btn active" id="tab-shop-btn" onclick="switchTab('shop')">Boutique</button>
        <button class="nav-btn" id="tab-collection-btn" onclick="switchTab('collection')">Codex (<span id="collection-count">0</span>)</button>
    </div>

    <!-- BOUTIQUE -->
    <div id="shop-view" class="container">
        <div style="font-size: 15px; color: #94A3B8; font-weight: bold; width: 100%; margin-bottom: 12px;">Choisissez votre Booster</div>
        
        <div class="pack-card" style="border-color: #4F46E5;">
            <div class="pack-header" style="background: #4F46E5;">Pack Mystère</div>
            <div class="pack-desc">3 cartes Wikipédia aléatoires</div>
            <button class="buy-btn" style="background: #4F46E5;" onclick="buyPack(50)">Ouvrir (50 🪙)</button>
        </div>

        <div class="pack-card" style="border-color: #D97706;">
            <div class="pack-header" style="background: #D97706;">Pack Histoire</div>
            <div class="pack-desc">3 cartes thématiques</div>
            <button class="buy-btn" style="background: #D97706;" onclick="buyPack(75)">Ouvrir (75 🪙)</button>
        </div>

        <button class="free-btn" onclick="addPoints()">+ Gagner 100 🪙 (Solo)</button>
    </div>

    <!-- OUVERTURE -->
    <div id="open-view" class="container hidden">
        <div id="loading-box" class="loading">Génération des cartes Wikipédia...</div>
        <div id="reveal-box" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div id="step-indicator" style="color: #94A3B8; font-weight: bold; margin-bottom: 10px;">Carte 1 / 3</div>
            
            <div class="card" id="card-box">
                <div class="rarity-badge" id="card-rarity">COMMUN</div>
                <div class="duplicate-badge hidden" id="card-duplicate">DOUBLON</div>
                <img id="card-img" class="card-img" src="" alt="Image">
                <div id="card-title" class="card-title">Titre</div>
                <div id="card-extract" class="card-extract">Résumé...</div>
            </div>

            <button class="primary-btn" onclick="nextCard()">Carte Suivante ➔</button>
        </div>
    </div>

    <!-- CODEX -->
    <div id="collection-view" class="container hidden">
        <div id="empty-collection" style="color: #94A3B8; text-align: center; margin-top: 40px;">Votre Codex est vide. Ouvrez des paquets !</div>
        <div class="grid" id="collection-grid"></div>
    </div>

    <script>
        let points = 200;
        let dust = 0;
        let collection = [];
        let currentPack = [];
        let currentIndex = 0;

        function updateUI() {
            document.getElementById('points-display').innerText = points;
            document.getElementById('dust-display').innerText = dust;
            document.getElementById('collection-count').innerText = collection.length;
        }

        function switchTab(tab) {
            document.getElementById('shop-view').classList.add('hidden');
            document.getElementById('open-view').classList.add('hidden');
            document.getElementById('collection-view').classList.add('hidden');
            
            document.getElementById('tab-shop-btn').classList.remove('active');
            document.getElementById('tab-collection-btn').classList.remove('active');

            if (tab === 'shop') {
                document.getElementById('shop-view').classList.remove('hidden');
                document.getElementById('tab-shop-btn').classList.add('active');
            } else if (tab === 'collection') {
                document.getElementById('collection-view').classList.remove('hidden');
                document.getElementById('tab-collection-btn').classList.add('active');
                renderCollection();
            }
        }

        function addPoints() {
            points += 100;
            updateUI();
        }

        function getRandomRarity() {
            let rand = Math.random();
            if (rand < 0.05) return { name: 'LÉGENDAIRE', color: '#F59E0B', dust: 50 };
            if (rand < 0.20) return { name: 'ÉPIQUE', color: '#A855F7', dust: 25 };
            if (rand < 0.50) return { name: 'RARE', color: '#3B82F6', dust: 10 };
            return { name: 'COMMUN', color: '#9CA3AF', dust: 5 };
        }

        async function buyPack(price) {
            if (points < price) {
                alert("Pas assez de points !");
                return;
            }
            points -= price;
            updateUI();

            document.getElementById('shop-view').classList.add('hidden');
            document.getElementById('open-view').classList.remove('hidden');
            document.getElementById('loading-box').classList.remove('hidden');
            document.getElementById('reveal-box').classList.add('hidden');

            try {
                let cards = [];
                for (let i = 0; i < 3; i++) {
                    let res = await fetch('https://fr.wikipedia.org/api/rest_v1/page/random/summary');
                    let data = await res.json();
                    let rarity = getRandomRarity();
                    
                    cards.push({
                        id: data.pageid || Math.random(),
                        title: data.title || "Article",
                        extract: data.extract || "Pas de description.",
                        image: data.thumbnail ? data.thumbnail.source : 'https://upload.wikimedia.org/wikipedia/commons/8/80/Wikipedia-logo-v2.svg',
                        rarity: rarity,
                        isDuplicate: false
                    });
                }

                cards = cards.map(card => {
                    let exists = collection.some(item => item.title === card.title);
                    if (exists) {
                        dust += card.rarity.dust;
                        return { ...card, isDuplicate: true };
                    } else {
                        collection.push(card);
                        return card;
                    }
                });

                currentPack = cards;
                currentIndex = 0;
                updateUI();
                
                document.getElementById('loading-box').classList.add('hidden');
                document.getElementById('reveal-box').classList.remove('hidden');
                displayCard();
            } catch (err) {
                alert("Erreur de chargement Wikipédia.");
                switchTab('shop');
            }
        }

        function displayCard() {
            if (currentIndex >= currentPack.length) {
                switchTab('shop');
                return;
            }
            let card = currentPack[currentIndex];
            document.getElementById('step-indicator').innerText = `Carte ${currentIndex + 1} / 3`;
            
            let badge = document.getElementById('card-rarity');
            badge.innerText = card.rarity.name;
            badge.style.background = card.rarity.color;
            
            let dupBadge = document.getElementById('card-duplicate');
            if (card.isDuplicate) {
                dupBadge.classList.remove('hidden');
                dupBadge.innerText = `DOUBLON (+${card.rarity.dust} ✨)`;
            } else {
                dupBadge.classList.add('hidden');
            }

            document.getElementById('card-box').style.borderColor = card.rarity.color;
            document.getElementById('card-img').src = card.image;
            document.getElementById('card-title').innerText = card.title;
            document.getElementById('card-extract').innerText = card.extract;
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex < currentPack.length) {
                displayCard();
            } else {
                switchTab('shop');
            }
        }

        function renderCollection() {
            let grid = document.getElementById('collection-grid');
            let emptyMsg = document.getElementById('empty-collection');
            grid.innerHTML = '';

            if (collection.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            collection.forEach(item => {
                let div = document.createElement('div');
                div.className = 'codex-card';
                div.style.borderColor = item.rarity.color;
                div.innerHTML = `
                    <img src="${item.image}" class="codex-img">
                    <div class="codex-title">${item.title}</div>
                    <div class="codex-rarity" style="color: ${item.rarity.color}">${item.rarity.name}</div>
                `;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
