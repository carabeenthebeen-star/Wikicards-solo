<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiCards Solo - Illimité</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0B0F19; color: #F8FAFC; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #6366F1; }
        .stats-summary { background: #1E293B; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; color: #38BDF8; }
        
        .nav { display: flex; width: 100%; max-width: 420px; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #1E293B; color: #FFF; font-weight: bold; cursor: pointer; font-size: 14px; }
        .nav-btn.active { background: #4F46E5; }

        .container { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; align-items: center; }

        /* BOUTON TIRAGE ILLIMITÉ */
        .unlimited-box { background: #1E293B; border-radius: 16px; border: 2px solid #6366F1; padding: 25px 20px; width: 100%; text-align: center; margin-bottom: 20px; }
        .unlimited-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .unlimited-desc { color: #94A3B8; font-size: 13px; margin-bottom: 20px; }
        .open-btn { background: linear-gradient(135deg, #6366F1, #A855F7); color: #FFF; border: none; padding: 16px; border-radius: 12px; width: 100%; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); text-transform: uppercase; letter-spacing: 1px; }

        /* PAQUET ET CARTE DE JEU */
        .card { background: #1E293B; border-radius: 16px; border: 3px solid #9CA3AF; width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; margin-bottom: 20px; min-height: 380px; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .rarity-badge { position: absolute; top: 12px; left: 12px; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; color: #000; letter-spacing: 0.5px; }
        .shiny-badge { position: absolute; top: 12px; right: 12px; background: linear-gradient(45deg, #000, #333); color: #FFD700; border: 1px solid #FFD700; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; }
        
        .card-img { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; margin-bottom: 15px; border: 2px solid #334155; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #FFF; }
        .card-extract { font-size: 12px; color: #94A3B8; line-height: 1.4; max-height: 80px; overflow: hidden; }

        .primary-btn { background: #4F46E5; color: #FFF; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; font-size: 15px; }

        /* CODEX / COLLECTION */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .codex-card { background: #1E293B; border-radius: 10px; border: 2px solid; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .codex-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-bottom: 6px; }
        .codex-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .codex-rarity { font-size: 9px; font-weight: 900; }
        
        .hidden { display: none !important; }
        .loading { text-align: center; color: #94A3B8; margin-top: 50px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>WikiCards</h1>
        <div class="stats-summary">Cartes : <span id="collection-count">0</span></div>
    </header>

    <div class="nav">
        <button class="nav-btn active" id="tab-draw-btn" onclick="switchTab('draw')">Tirage Illimité</button>
        <button class="nav-btn" id="tab-collection-btn" onclick="switchTab('collection')">Codex</button>
    </div>

    <!-- TIRAGE ILLIMITÉ -->
    <div id="draw-view" class="container">
        <div class="unlimited-box">
            <div class="unlimited-title">Pack Wikipédia</div>
            <div class="unlimited-desc">Contient 5 cartes tirées au hasard avec les probabilités réelles.</div>
            <button class="open-btn" onclick="openPack()">Ouvrir un Paquet (5 Cartes)</button>
        </div>
    </div>

    <!-- REVELATION -->
    <div id="open-view" class="container hidden">
        <div id="loading-box" class="loading">Extraction des articles de Wikipédia...</div>
        <div id="reveal-box" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div id="step-indicator" style="color: #94A3B8; font-weight: bold; margin-bottom: 10px;">Carte 1 / 5</div>
            
            <div class="card" id="card-box">
                <div class="rarity-badge" id="card-rarity">COMMUNE</div>
                <div class="shiny-badge hidden" id="card-shiny">★ SHINY ★</div>
                <img id="card-img" class="card-img" src="" alt="Image">
                <div id="card-title" class="card-title">Titre</div>
                <div id="card-extract" class="card-extract">Résumé...</div>
            </div>

            <button class="primary-btn" id="next-btn" onclick="nextCard()">Carte Suivante ➔</button>
        </div>
    </div>

    <!-- CODEX -->
    <div id="collection-view" class="container hidden">
        <div id="empty-collection" style="color: #94A3B8; text-align: center; margin-top: 40px;">Votre Codex est vide. Ouvrez des paquets !</div>
        <div class="grid" id="collection-grid"></div>
    </div>

    <script>
        let collection = [];
        let currentPack = [];
        let currentIndex = 0;

        function updateUI() {
            document.getElementById('collection-count').innerText = collection.length;
        }

        function switchTab(tab) {
            document.getElementById('draw-view').classList.add('hidden');
            document.getElementById('open-view').classList.add('hidden');
            document.getElementById('collection-view').classList.add('hidden');
            
            document.getElementById('tab-draw-btn').classList.remove('active');
            document.getElementById('tab-collection-btn').classList.remove('active');

            if (tab === 'draw') {
                document.getElementById('draw-view').classList.remove('hidden');
                document.getElementById('tab-draw-btn').classList.add('active');
            } else if (tab === 'collection') {
                document.getElementById('collection-view').classList.remove('hidden');
                document.getElementById('tab-collection-btn').classList.add('active');
                renderCollection();
            }
        }

        /* PROBABILITÉS EXACTES WIKIMASTER */
        function getRandomRarity() {
            let rand = Math.random() * 100;
            
            if (rand < 0.25) {
                // Légendaire (0.25%)
                let isShiny = Math.random() < 0.01; // 1% de chance Shiny
                return { name: 'LÉGENDAIRE', color: '#F59E0B', isShiny: isShiny };
            } else if (rand < 2.75) {
                // Ultra Rare (2.5%)
                return { name: 'ULTRA RARE', color: '#EF4444', isShiny: false };
            } else if (rand < 9.75) {
                // Super Rare (7.0%)
                return { name: 'SUPER RARE', color: '#A855F7', isShiny: false };
            } else if (rand < 29.75) {
                // Rare (20.0%)
                return { name: 'RARE', color: '#3B82F6', isShiny: false };
            } else if (rand < 49.75) {
                // Peu Commune (20.0%)
                return { name: 'PEU COMMUNE', color: '#10B981', isShiny: false };
            } else {
                // Commune (50.25%)
                return { name: 'COMMUNE', color: '#9CA3AF', isShiny: false };
            }
        }

        async function openPack() {
            document.getElementById('draw-view').classList.add('hidden');
            document.getElementById('open-view').classList.remove('hidden');
            document.getElementById('loading-box').classList.remove('hidden');
            document.getElementById('reveal-box').classList.add('hidden');

            try {
                let cards = [];
                for (let i = 0; i < 5; i++) {
                    let res = await fetch('https://fr.wikipedia.org/api/rest_v1/page/random/summary');
                    let data = await res.json();
                    let rarity = getRandomRarity();
                    
                    let card = {
                        id: data.pageid || Math.random(),
                        title: data.title || "Article Wikipédia",
                        extract: data.extract || "Pas de description disponible.",
                        image: data.thumbnail ? data.thumbnail.source : 'https://upload.wikimedia.org/wikipedia/commons/8/80/Wikipedia-logo-v2.svg',
                        rarity: rarity
                    };

                    cards.push(card);
                    
                    // Ajout au codex sans doublon strict
                    if (!collection.some(item => item.title === card.title)) {
                        collection.push(card);
                    }
                }

                currentPack = cards;
                currentIndex = 0;
                updateUI();
                
                document.getElementById('loading-box').classList.add('hidden');
                document.getElementById('reveal-box').classList.remove('hidden');
                displayCard();
            } catch (err) {
                alert("Erreur lors de la récupération des données Wikipédia.");
                switchTab('draw');
            }
        }

        function displayCard() {
            if (currentIndex >= currentPack.length) {
                switchTab('draw');
                return;
            }
            let card = currentPack[currentIndex];
            document.getElementById('step-indicator').innerText = `Carte ${currentIndex + 1} / 5`;
            
            let badge = document.getElementById('card-rarity');
            badge.innerText = card.rarity.name;
            badge.style.background = card.rarity.color;
            
            let shinyBadge = document.getElementById('card-shiny');
            if (card.rarity.isShiny) {
                shinyBadge.classList.remove('hidden');
            } else {
                shinyBadge.classList.add('hidden');
            }

            document.getElementById('card-box').style.borderColor = card.rarity.isShiny ? '#FFD700' : card.rarity.color;
            document.getElementById('card-img').src = card.image;
            document.getElementById('card-title').innerText = card.title;
            document.getElementById('card-extract').innerText = card.extract;

            let nextBtn = document.getElementById('next-btn');
            if (currentIndex === currentPack.length - 1) {
                nextBtn.innerText = "Terminer le paquet ➔";
            } else {
                nextBtn.innerText = "Carte Suivante ➔";
            }
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex < currentPack.length) {
                displayCard();
            } else {
                switchTab('draw');
            }
        }

        function renderCollection() {
            let grid = document.getElementById('collection-grid');
            let emptyMsg = document.getElementById('empty-collection');
            grid.innerHTML = '';

            if (collection.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            collection.forEach(item => {
                let div = document.createElement('div');
                div.className = 'codex-card';
                div.style.borderColor = item.rarity.isShiny ? '#FFD700' : item.rarity.color;
                div.innerHTML = `
                    <img src="${item.image}" class="codex-img">
                    <div class="codex-title">${item.title}</div>
                    <div class="codex-rarity" style="color: ${item.rarity.color}">${item.rarity.name} ${item.rarity.isShiny ? '★' : ''}</div>
                `;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
