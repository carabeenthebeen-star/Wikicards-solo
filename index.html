<!-- WIKIMASTER-STYLE : OUVERTURE DE PAQUETS -->
<div id="wm-app">
  <style>
    #wm-app {
      --bg: #0b1020;
      --panel: #151d32;
      --gold: #ffc857;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
      background: var(--bg);
      padding: 18px;
      border-radius: 18px;
      min-height: 600px;
      box-sizing: border-box;
    }

    #wm-app * { box-sizing: border-box; }

    #wm-app .wm-header {
      text-align: center;
      padding: 16px 0 24px;
    }

    #wm-app .wm-header h1 {
      font-size: clamp(27px, 6vw, 40px);
      margin: 0 0 8px;
      color: var(--gold);
      letter-spacing: 1px;
    }

    #wm-app .wm-header p { color: #aebbd4; margin: 0; }

    #wm-app .wm-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 22px;
    }

    #wm-app .wm-stat {
      background: var(--panel);
      border: 1px solid #293754;
      border-radius: 12px;
      padding: 13px 5px;
      text-align: center;
    }

    #wm-app .wm-stat strong {
      display: block;
      color: var(--gold);
      font-size: 23px;
      margin-bottom: 5px;
    }

    #wm-app .wm-stat span {
      font-size: 11px;
      color: #bdc9df;
    }

    #wm-app .wm-section-title {
      font-size: 19px;
      margin: 22px 0 12px;
    }

    #wm-app .wm-packs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 12px;
    }

    #wm-app .wm-pack {
      border: 1px solid #344361;
      border-radius: 15px;
      background: linear-gradient(145deg, #202d4a, #121a2d);
      padding: 15px 9px;
      text-align: center;
      cursor: pointer;
      color: white;
      min-width: 0;
      transition: transform .15s, border-color .15s;
    }

    #wm-app .wm-pack:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
    }

    #wm-app .wm-pack:active { transform: scale(.97); }

    #wm-app .wm-pack-art {
      height: 105px;
      display: grid;
      place-items: center;
      font-size: 58px;
      border-radius: 10px;
      margin-bottom: 12px;
      background: radial-gradient(circle, #394e79, #121a2d 75%);
    }

    #wm-app .wm-pack h3 { margin: 5px 0; font-size: 15px; }
    #wm-app .wm-pack p { margin: 7px 0 0; color: #b9c5db; font-size: 12px; }

    #wm-app .wm-button {
      background: var(--gold);
      color: #19172a;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    #wm-app .wm-button:hover { filter: brightness(1.08); }

    #wm-app .wm-button.secondary {
      color: white;
      background: #293754;
      border: 1px solid #405274;
    }

    #wm-app .wm-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    #wm-app .wm-toolbar input,
    #wm-app .wm-toolbar select {
      min-width: 0;
      flex: 1;
      padding: 11px;
      color: white;
      background: #151d32;
      border: 1px solid #344361;
      border-radius: 9px;
    }

    #wm-app .wm-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
    }

    #wm-app .wm-card {
      border-radius: 13px;
      padding: 10px;
      background: #182239;
      border: 2px solid #637087;
      text-align: center;
      overflow: hidden;
      animation: wm-appear .3s ease both;
    }

    #wm-app .wm-card .wm-card-art {
      min-height: 110px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 57px;
      background: radial-gradient(circle, #364c70, #10172a);
      margin-bottom: 10px;
    }

    #wm-app .wm-card h3 {
      font-size: 14px;
      margin: 7px 0;
      overflow-wrap: anywhere;
    }

    #wm-app .wm-card .wm-rarity {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: bold;
    }

    #wm-app .wm-card .wm-qty {
      font-size: 11px;
      color: #c3cde0;
      margin-top: 7px;
    }

    #wm-app .r-Commun { border-color: #8492a8; }
    #wm-app .r-Rare { border-color: #42a5ff; }
    #wm-app .r-Épique { border-color: #c071ff; }
    #wm-app .r-Légendaire { border-color: #ffc857; }
    #wm-app .r-Mythique {
      border-color: #ff638d;
      box-shadow: 0 0 12px #ff638d35;
    }

    #wm-app .rarity-Commun { color: #b5c0d0; }
    #wm-app .rarity-Rare { color: #42a5ff; }
    #wm-app .rarity-Épique { color: #ce8aff; }
    #wm-app .rarity-Légendaire { color: #ffc857; }
    #wm-app .rarity-Mythique { color: #ff7fa0; }

    #wm-app .wm-results {
      margin-top: 22px;
      padding: 16px;
      border-radius: 15px;
      background: #10182b;
      border: 1px solid #293754;
    }

    #wm-app .wm-results-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    #wm-app .wm-results-head h2 { font-size: 19px; margin: 0; }

    #wm-app .wm-empty {
      text-align: center;
      padding: 25px 8px;
      color: #aebbd4;
    }

    #wm-app .wm-hidden { display: none !important; }

    @keyframes wm-appear {
      from { opacity: 0; transform: translateY(8px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 380px) {
      #wm-app { padding: 12px; }
      #wm-app .wm-packs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #wm-app .wm-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>

  <header class="wm-header">
    <h1>⚡ WIKI MASTER</h1>
    <p>Ouvre tes paquets. Découvre des cartes. Complète ta collection.</p>
  </header>

  <div class="wm-stats">
    <div class="wm-stat">
      <strong id="wm-total">0</strong>
      <span>CARTES OBTENUES</span>
    </div>
    <div class="wm-stat">
      <strong id="wm-unique">0</strong>
      <span>CARTES UNIQUES</span>
    </div>
    <div class="wm-stat">
      <strong id="wm-packs-opened">0</strong>
      <span>PAQUETS OUVERTS</span>
    </div>
  </div>

  <h2 class="wm-section-title">🎁 Boutique de paquets</h2>
  <div class="wm-packs">
    <button class="wm-pack" data-pack="basic">
      <div class="wm-pack-art">📦</div>
      <h3>Paquet classique</h3>
      <p>5 cartes · Gratuit</p>
    </button>

    <button class="wm-pack" data-pack="rare">
      <div class="wm-pack-art">💎</div>
      <h3>Paquet rare</h3>
      <p>5 cartes · Gratuit</p>
    </button>

    <button class="wm-pack" data-pack="epic">
      <div class="wm-pack-art">🔮</div>
      <h3>Paquet épique</h3>
      <p>5 cartes · Gratuit</p>
    </button>

    <button class="wm-pack" data-pack="legend">
      <div class="wm-pack-art">👑</div>
      <h3>Paquet légendaire</h3>
      <p>5 cartes · Gratuit</p>
    </button>
  </div>

  <section id="wm-results" class="wm-results wm-hidden">
    <div class="wm-results-head">
      <h2>✨ Tes cartes obtenues</h2>
      <button id="wm-close-results" class="wm-button secondary">Fermer</button>
    </div>
    <div id="wm-new-cards" class="wm-cards"></div>
  </section>

  <h2 class="wm-section-title">📚 Ma collection</h2>

  <div class="wm-toolbar">
    <input id="wm-search" type="search" placeholder="Rechercher une carte...">
    <select id="wm-filter" aria-label="Filtrer par rareté">
      <option value="all">Toutes les raretés</option>
      <option value="Commun">Communes</option>
      <option value="Rare">Rares</option>
      <option value="Épique">Épiques</option>
      <option value="Légendaire">Légendaires</option>
      <option value="Mythique">Mythiques</option>
    </select>
  </div>

  <div id="wm-collection" class="wm-cards"></div>
  <p id="wm-empty" class="wm-empty">Ouvre ton premier paquet pour obtenir tes cartes !</p>

  <div style="text-align:center;margin-top:25px">
    <button id="wm-reset" class="wm-button secondary">Réinitialiser ma collection</button>
  </div>

  <script>
  (function () {
    "use strict";

    const root = document.getElementById("wm-app");
    if (!root || root.dataset.initialized === "yes") return;
    root.dataset.initialized = "yes";

    const cards = [
      { id: 1, name: "Guerrier solaire", emoji: "⚔️", rarity: "Commun" },
      { id: 2, name: "Mage des flammes", emoji: "🔥", rarity: "Commun" },
      { id: 3, name: "Gardien des forêts", emoji: "🌳", rarity: "Commun" },
      { id: 4, name: "Archer lunaire", emoji: "🏹", rarity: "Commun" },
      { id: 5, name: "Chevalier de fer", emoji: "🛡️", rarity: "Commun" },
      { id: 6, name: "Loup des ombres", emoji: "🐺", rarity: "Commun" },
      { id: 7, name: "Dragon bleu", emoji: "🐉", rarity: "Rare" },
      { id: 8, name: "Assassin spectral", emoji: "🥷", rarity: "Rare" },
      { id: 9, name: "Reine des glaces", emoji: "❄️", rarity: "Rare" },
      { id: 10, name: "Phénix royal", emoji: "🦅", rarity: "Rare" },
      { id: 11, name: "Samouraï éternel", emoji: "🥷", rarity: "Rare" },
      { id: 12, name: "Druide ancien", emoji: "🌿", rarity: "Rare" },
      { id: 13, name: "Démon abyssal", emoji: "👹", rarity: "Épique" },
      { id: 14, name: "Ange céleste", emoji: "😇", rarity: "Épique" },
      { id: 15, name: "Titan de cristal", emoji: "💠", rarity: "Épique" },
      { id: 16, name: "Sorcière du néant", emoji: "🧙", rarity: "Épique" },
      { id: 17, name: "Dragon des étoiles", emoji: "🐲", rarity: "Légendaire" },
      { id: 18, name: "Empereur divin", emoji: "👑", rarity: "Légendaire" },
      { id: 19, name: "Dieu de la guerre", emoji: "⚡", rarity: "Légendaire" },
      { id: 20, name: "Phoenix primordial", emoji: "🌋", rarity: "Mythique" },
      { id: 21, name: "Roi du multivers", emoji: "🌌", rarity: "Mythique" },
      { id: 22, name: "Créateur absolu", emoji: "✨", rarity: "Mythique" }
    ];

    const weights = {
      basic:  { Commun: 68, Rare: 23, Épique: 7, Légendaire: 1.8, Mythique: 0.2 },
      rare:   { Commun: 35, Rare: 42, Épique: 18, Légendaire: 4.5, Mythique: 0.5 },
      epic:   { Commun: 10, Rare: 30, Épique: 45, Légendaire: 13, Mythique: 2 },
      legend: { Commun: 0, Rare: 10, Épique: 30, Légendaire: 50, Mythique: 10 }
    };

    const packNames = {
      basic: "Paquet classique",
      rare: "Paquet rare",
      epic: "Paquet épique",
      legend: "Paquet légendaire"
    };

    const storageKey = "wm_collection_v1";
    let collection = {};
    let packsOpened = 0;
    let sessionTotal = 0;

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
      if (saved && typeof saved === "object") {
        collection = saved.collection && typeof saved.collection === "object"
          ? saved.collection : {};
        packsOpened = Number.isFinite(saved.packsOpened)
          ? saved.packsOpened : 0;
        sessionTotal = Number.isFinite(saved.sessionTotal)
          ? saved.sessionTotal : 0;
      }
    } catch (error) {
      console.warn("Sauvegarde indisponible : la collection reste en mémoire.", error);
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({
          collection: collection,
          packsOpened: packsOpened,
          sessionTotal: sessionTotal
        }));
      } catch (error) {
        console.warn("Impossible de sauvegarder sur cet appareil.", error);
      }
    }

    function chooseRarity(packType) {
      const table = weights[packType] || weights.basic;
      const roll = Math.random() * 100;
      let sum = 0;

      for (const rarity of [
        "Commun", "Rare", "Épique", "Légendaire", "Mythique"
      ]) {
        sum += table[rarity] || 0;
        if (roll < sum) return rarity;
      }
      return "Commun";
    }

    function chooseCard(packType) {
      const rarity = chooseRarity(packType);
      const pool = cards.filter(card => card.rarity === rarity);
      const selected = pool[Math.floor(Math.random() * pool.length)];
      return selected || cards[0];
    }

    function cardHTML(card, qty) {
      const rarityClass = card.rarity.replace(/[^a-zA-ZÀ-ÿ]/g, "");
      return `
        <article class="wm-card r-${rarityClass}">
          <div class="wm-card-art">${card.emoji}</div>
          <h3>${card.name}</h3>
          <div class="wm-rarity rarity-${rarityClass}">${card.rarity}</div>
          ${qty !== null ? `<div class="wm-qty">Possédées : ${qty}</div>` : ""}
        </article>
      `;
    }

    function updateStats() {
      const unique = Object.keys(collection).filter(id =>
        Number(collection[id]) > 0
      ).length;

      const total = Object.values(collection).reduce((sum, qty) =>
        sum + Math.max(0, Number(qty) || 0), 0);

      root.querySelector("#wm-total").textContent = total;
      root.querySelector("#wm-unique").textContent = unique;
      root.querySelector("#wm-packs-opened").textContent = packsOpened;
    }

    function renderCollection() {
      const container = root.querySelector("#wm-collection");
      const empty = root.querySelector("#wm-empty");
      const search = root.querySelector("#wm-search").value
        .trim().toLowerCase();
      const filter = root.querySelector("#wm-filter").value;

      const owned = cards.filter(card => Number(collection[card.id]) > 0)
        .filter(card => card.name.toLowerCase().includes(search))
        .filter(card => filter === "all" || card.rarity === filter)
        .sort((a, b) => {
          const order = {
            Mythique: 0, Légendaire: 1, Épique: 2, Rare: 3, Commun: 4
          };
          return order[a.rarity] - order[b.rarity];
        });

      container.innerHTML = owned.map(card =>
        cardHTML(card, Number(collection[card.id]) || 0)
      ).join("");

      empty.classList.toggle("wm-hidden", owned.length > 0);

      if (owned.length === 0) {
        empty.textContent = Object.values(collection).some(qty => Number(qty) > 0)
          ? "Aucune carte ne correspond à ta recherche."
          : "Ouvre ton premier paquet pour obtenir tes cartes !";
      }

      updateStats();
    }

    function openPack(type) {
      if (!weights[type]) return;

      const newCards = [];

      // Ouverture immédiate : aucun délai ni animation bloquante.
      for (let i = 0; i < 5; i++) {
        const card = chooseCard(type);
        newCards.push(card);
        collection[card.id] = (Number(collection[card.id]) || 0) + 1;
      }

      packsOpened++;
      sessionTotal += 5;
      save();

      root.querySelector("#wm-new-cards").innerHTML =
        newCards.map(card => cardHTML(card, null)).join("");

      root.querySelector("#wm-results").classList.remove("wm-hidden");
      renderCollection();

      root.querySelector("#wm-results").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    root.querySelectorAll("[data-pack]").forEach(button => {
      button.addEventListener("click", function () {
        openPack(this.dataset.pack);
      });
    });

    root.querySelector("#wm-close-results").addEventListener("click", function () {
      root.querySelector("#wm-results").classList.add("wm-hidden");
    });

    root.querySelector("#wm-search").addEventListener("input", renderCollection);
    root.querySelector("#wm-filter").addEventListener("change", renderCollection);

    root.querySelector("#wm-reset").addEventListener("click", function () {
      if (!confirm("Effacer toute ta collection et les statistiques ?")) return;

      collection = {};
      packsOpened = 0;
      sessionTotal = 0;
      save();

      root.querySelector("#wm-results").classList.add("wm-hidden");
      renderCollection();
    });

    renderCollection();
  })();
  </script>
</div>
<!-- FIN WIKIMASTER-STYLE -->
