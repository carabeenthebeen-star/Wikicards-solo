<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WikiMaster</title>
    <style>
        :root {
            --bg-color: #0b0c0e;
            --surface-color: #121418;
            --accent-green: #22c55e;
            --text-primary: #ffffff;
            --text-secondary: #8a94a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding-bottom: 70px;
        }

        header {
            width: 100%;
            max-width: 420px;
            padding: 14px 18px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .currency-badge {
            background: #0f1f17;
            border: 1px solid #1c3d2a;
            border-radius: 20px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-green);
            font-weight: 800;
            font-size: 14px;
        }

        .currency-icon {
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--accent-green);
            color: var(--accent-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 900;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        .title-main {
            font-size: 30px;
            font-weight: 900;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .booster-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .booster-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            text-align: center;
        }

        .booster-link {
            color: var(--accent-green);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .booster-pack {
            width: 190px;
            height: 270px;
            background: linear-gradient(175deg, #ffffff 0%, #e2e8f0 70%, #cbd5e1 100%);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
        }

        .wm-badge {
            width: 72px;
            height: 72px;
            background: #000000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-open {
            background: transparent;
            border: none;
            color: var(--accent-green);
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            padding: 10px;
        }

        .card-stage {
            perspective: 1000px;
            width: 300px;
            height: 420px;
            margin: 10px 0 20px 0;
            cursor: pointer;
        }

        .card-flipper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .card-flipper.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 16px;
            border: 3px solid #262c38;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #14171f;
        }

        .card-back {
            background: #0d1017;
            align-items: center;
            justify-content: center;
        }

        .card-front {
            transform: rotateY(180deg);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 15px;
            font-weight: 900;
            color: #fff;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            color: #000;
        }

        .card-img-box {
            width: 100%;
            height: 190px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            background: #090c10;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .card-desc {
            font-size: 11px;
            color: #94a3b8;
            height: 40px;
            overflow: hidden;
        }

        .btn-action {
            width: 100%;
            max-width: 300px;
            background: #122e1d;
            border: 1.5px solid var(--accent-green);
            color: var(--accent-green);
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .mini-card {
            background: #14171f;
            border: 2px solid #262c38;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
        }

        .mini-img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
            margin-bottom: 6px;
        }

        .mini-title {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-rarity {
            font-size: 9px;
            font-weight: 900;
            margin-top: 2px;
            text-transform: uppercase;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f1115;
            border-top: 1px solid #1a1e26;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: #525d73;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="currency-badge">
            <div class="currency-icon">W</div>
            <span>10 964</span>
        </div>
    </header>

    <!-- BOUTIQUE -->
    <div id="view-shop" class="main-container">
        <h1 class="title-main">Ouvrir un paquet</h1>
        <div class="booster-wrapper">
            <div class="booster-subtitle">Découvrez 5 nouvelles cartes Wikipédia</div>
            <div class="booster-link">Comment ça marche ?</div>

            <div class="booster-pack" onclick="openBoosterPack()">
                <div class="wm-badge">WM</div>
            </div>

            <button class="btn-open" onclick="openBoosterPack()">Ouvrir</button>
        </div>
    </div>

    <!-- TIRAGE -->
    <div id="view-pull" class="main-container hidden">
        <div id="pull-progress" style="font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px;">Carte 1 / 5</div>

        <div class="card-stage" onclick="flipActiveCard()">
            <div class="card-flipper" id="card-flipper">
                <div class="card-face card-back">
                    <div class="wm-badge">WM</div>
                </div>
                <div class="card-face card-front" id="card-front">
                    <div class="card-top">
                        <div class="card-title" id="c-title">Titre</div>
                        <div class="card-badge" id="c-badge">COMMUNE</div>
                    </div>
                    <div class="card-img-box">
                        <img id="c-img" src="" alt="Image" onerror="this.src='https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&q=80'">
                    </div>
                    <div class="card-stats">
                        <div><span style="font-size:9px;color:#8a94a6">ATK </span><strong id="c-atk">0</strong></div>
                        <div><span style="font-size:9px;color:#8a94a6">DEF </span><strong id="c-def">0</strong></div>
                    </div>
                    <div class="card-desc" id="c-desc">Description...</div>
                </div>
            </div>
        </div>

        <button class="btn-action" id="btn-next-step" onclick="handleNextStep()">Révéler la carte</button>
    </div>

    <!-- RECAP -->
    <div id="view-recap" class="main-container hidden">
        <h1 class="title-main" style="font-size: 22px;">Paquet ouvert !</h1>
        <div class="grid-cards" id="recap-grid" style="margin-bottom: 20px;"></div>
        <button class="btn-action" onclick="switchTab('shop')">Terminer</button>
    </div>

    <!-- COLLECTION -->
    <div id="view-collection" class="main-container hidden">
        <h1 class="title-main" style="font-size: 22px;">Ma Collection</h1>
        <div id="col-empty" style="color: var(--text-secondary); margin-top: 30px;">Aucune carte pour l'instant.</div>
        <div class="grid-cards" id="collection-grid"></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('shop')">
            <span>🧩 Paquets</span>
        </button>
        <button class="nav-item" onclick="switchTab('collection')">
            <span>📖 Collection</span>
        </button>
    </nav>

    <script>
        let collection = [];
        let activePack = [];
        let packIndex = 0;
        let isFlipped = false;

        const FALLBACK_IMG = "https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&q=80";
        const SAFE_CARDS = [
            { title: "La Joconde", desc: "Tableau de Léonard de Vinci au Louvre.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/400px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg", atk: 8500, def: 7200 },
            { title: "Tour Eiffel", desc: "Monument parisien de 330 mètres.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Tour_Eiffel_Wikimedia_Commons_%28cropped%29.jpg/400px-Tour_Eiffel_Wikimedia_Commons_%28cropped%29.jpg", atk: 6400, def: 8900 },
            { title: "Système solaire", desc: "Système planétaire de notre étoile.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Planets2013.svg/500px-Planets2013.svg.png", atk: 9000, def: 9000 },
            { title: "Napoléon Ier", desc: "Empereur des Français.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Jacques-Louis_David_-_The_Emperor_Napoleon_in_His_Study_at_the_Tuileries_-_Google_Art_Project.jpg/400px-Jacques-Louis_David_-_The_Emperor_Napoleon_in_His_Study_at_the_Tuileries_-_Google_Art_Project.jpg", atk: 7800, def: 6500 },
            { title: "Baleine bleue", desc: "Le plus grand animal vivant.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Blue_Whale_001_body_full.jpg/400px-Blue_Whale_001_body_full.jpg", atk: 9500, def: 8000 }
        ];

        let cardCache = [...SAFE_CARDS, ...SAFE_CARDS, ...SAFE_CARDS];

        function getRandomRarity() {
            let r = Math.random() * 100;
            if (r < 0.1) return { name: 'Légendaire', color: '#f59e0b' };
            if (r < 1.5) return { name: 'Ultra Rare', color: '#ef4444' };
            if (r < 6.5) return { name: 'Super Rare', color: '#a855f7' };
            if (r < 20)  return { name: 'Rare', color: '#3b82f6' };
            if (r < 45)  return { name: 'Peu Commune', color: '#22c55e' };
            return { name: 'Commune', color: '#94a3b8' };
        }

        function switchTab(tab) {
            try {
                document.getElementById('view-shop').classList.add('hidden');
                document.getElementById('view-pull').classList.add('hidden');
                document.getElementById('view-recap').classList.add('hidden');
                document.getElementById('view-collection').classList.add('hidden');
                
                const navItems = document.querySelectorAll('.nav-item');
                navItems.forEach(el => el.classList.remove('active'));

                if (tab === 'shop') {
                    document.getElementById('view-shop').classList.remove('hidden');
                    navItems[0].classList.add('active');
                } else if (tab === 'collection') {
                    document.getElementById('view-collection').classList.remove('hidden');
                    navItems[1].classList.add('active');
                    renderCollection();
                }
            } catch(err) {
                console.error(err);
            }
        }

        function openBoosterPack() {
            try {
                activePack = [];
                for (let i = 0; i < 5; i++) {
                    let template = cardCache[Math.floor(Math.random() * cardCache.length)];
                    activePack.push({
                        ...template,
                        rarity: getRandomRarity()
                    });
                }

                packIndex = 0;
                switchTab('pull');
                loadCardInStage();
            } catch(err) {
                alert("Erreur ouverture : " + err.message);
            }
        }

        function loadCardInStage() {
            try {
                isFlipped = false;
                document.getElementById('card-flipper').classList.remove('flipped');
                document.getElementById('pull-progress').innerText = `Carte ${packIndex + 1} / 5`;
                document.getElementById('btn-next-step').innerText = "Révéler la carte";

                let card = activePack[packIndex];
                if (!collection.some(c => c.title === card.title)) {
                    collection.push(card);
                }

                document.getElementById('c-title').innerText = card.title;
                document.getElementById('c-desc').innerText = card.desc;
                document.getElementById('c-img').src = card.img;
                document.getElementById('c-atk').innerText = card.atk;
                document.getElementById('c-def').innerText = card.def;

                let badge = document.getElementById('c-badge');
                badge.innerText = card.rarity.name;
                badge.style.background = card.rarity.color;
                document.getElementById('card-front').style.borderColor = card.rarity.color;
            } catch(err) {
                console.error(err);
            }
        }

        function flipActiveCard() {
            if (!isFlipped) {
                isFlipped = true;
                document.getElementById('card-flipper').classList.add('flipped');
                document.getElementById('btn-next-step').innerText = packIndex < 4 ? "Carte Suivante ➔" : "Voir le récapitulatif";
            }
        }

        function handleNextStep() {
            if (!isFlipped) {
                flipActiveCard();
            } else {
                packIndex++;
                if (packIndex < 5) {
                    loadCardInStage();
                } else {
                    showRecap();
                }
            }
        }

        function showRecap() {
            document.getElementById('view-pull').classList.add('hidden');
            document.getElementById('view-recap').classList.remove('hidden');
            let grid = document.getElementById('recap-grid');
            grid.innerHTML = '';
            activePack.forEach(c => {
                let div = document.createElement('div');
                div.className = 'mini-card';
                div.style.borderColor = c.rarity.color;
                div.innerHTML = `
                    <img src="${c.img}" class="mini-img" onerror="this.src='${FALLBACK_IMG}'">
                    <div class="mini-title">${c.title}</div>
                    <div class="mini-rarity" style="color:${c.rarity.color}">${c.rarity.name}</div>
                `;
                grid.appendChild(div);
            });
        }

        function renderCollection() {
            let grid = document.getElementById('collection-grid');
            let empty = document.getElementById('col-empty');
            grid.innerHTML = '';
            if (collection.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            collection.forEach(c => {
                let div = document.createElement('div');
                div.className = 'mini-card';
                div.style.borderColor = c.rarity.color;
                div.innerHTML = `
                    <img src="${c.img}" class="mini-img" onerror="this.src='${FALLBACK_IMG}'">
                    <div class="mini-title">${c.title}</div>
                    <div class="mini-rarity" style="color:${c.rarity.color}">${c.rarity.name}</div>
                `;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
